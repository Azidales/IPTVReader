appId: com.iptvreader.desktop
productName: IPTVReader
asar: true
directories:
  output: release
files:
  - desktop/**/*
  - dist-desktop/**/*
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
