name: Windows Desktop Build
on:
  push:
    branches: [main, fix/native-video]
    paths:
      - 'desktop/**'
      - 'src/desktop.ts'
      - 'src/styles/desktop.css'
      - 'desktop.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vite.desktop.config.ts'
      - 'electron-builder.yml'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate catalog and scripts
        run: npm run test:desktop
      - name: Validate playlist parser
        run: npm test
      - name: Build desktop renderer
        run: npm run build:desktop
      - name: Build installer and portable executable
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Separate Windows packages and checksums
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem release -Filter '*.exe')
          $installer = @($executables | Where-Object { $_.Name -match 'Setup' })
          $portable = @($executables | Where-Object { $_.Name -notmatch 'Setup' })
          if ($installer.Count -ne 1 -or $portable.Count -ne 1) { throw "Expected exactly one installer and one portable executable." }
          New-Item -ItemType Directory -Path release/portable,release/installer -Force | Out-Null
          Copy-Item $installer[0].FullName release/installer/IPTVReader-Setup.exe
          Copy-Item $portable[0].FullName release/portable/IPTVReader-Portable.exe
          foreach ($name in @('installer','portable')) {
            $exe = @(Get-ChildItem "release/$name" -Filter '*.exe')[0]
            $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
            "$hash  $($exe.Name)" | Set-Content -Encoding ascii -Path "release/$name/SHA256SUMS.txt"
          }
      - name: Upload portable only
        uses: actions/upload-artifact@v4
        with:
          name: IPTVReader-Windows-Portable
          path: release/portable/*
          retention-days: 30
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: IPTVReader-Windows-Installer
          path: release/installer/*
          retention-days: 30
      - name: Publish test release
        if: github.ref == 'refs/heads/fix/native-video'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          Copy-Item release/portable/SHA256SUMS.txt release/Portable-SHA256SUMS.txt
          Copy-Item release/installer/SHA256SUMS.txt release/Installer-SHA256SUMS.txt
          if (gh release view $tag 2>$null) {
            gh release edit $tag --target "$env:GITHUB_SHA" --prerelease --title "IPTVReader $version — vídeo nativo" --notes-file docs/native-video-test.md
            gh release upload $tag release/portable/IPTVReader-Portable.exe release/installer/IPTVReader-Setup.exe release/Portable-SHA256SUMS.txt release/Installer-SHA256SUMS.txt --clobber
          } else {
            gh release create $tag --target "$env:GITHUB_SHA" --prerelease --title "IPTVReader $version — vídeo nativo" --notes-file docs/native-video-test.md release/portable/IPTVReader-Portable.exe release/installer/IPTVReader-Setup.exe release/Portable-SHA256SUMS.txt release/Installer-SHA256SUMS.txt
          }
